[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.20.2"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/georgeboot/dess-oxide"

[workspace.dependencies]
dess-core = { path = "crates/dess-core" }
dess-victron = { path = "crates/dess-victron" }
dess-models = { path = "crates/dess-models" }

anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query", "form"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
jiff = { version = "0.2.37", features = ["serde", "tzdb-bundle-always"] }
maud = "0.27.0"
proptest = "1.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2", "query"] }
rumqttc = { version = "0.25.1", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# ring instead of aws-lc-rs: no cmake/clang needed to build for musl.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tokio-tungstenite = "0.30.0"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Exact comparisons are intended where they appear (parsed values, tests).
float_cmp = "allow"
# Domain names like slot/spot and buy/sell are fine.
similar_names = "allow"
# Only lock poisoning, which is a bug elsewhere, can panic.
missing_panics_doc = "allow"

# Numeric dependencies (burn, ndarray) are far too slow unoptimised; our own
# code stays debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
