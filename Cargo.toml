[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/georgeboot/dess-oxide"

[workspace.dependencies]
dess-core = { path = "crates/dess-core" }
dess-victron = { path = "crates/dess-victron" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "0.2.37", features = ["serde"] }
proptest = "1.11.0"
rumqttc = { version = "0.25.1", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Exact comparisons are intended where they appear (parsed values, tests).
float_cmp = "allow"
# Only lock poisoning, which is a bug elsewhere, can panic.
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
strip = true
