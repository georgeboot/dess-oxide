# Home Assistant app definition. Keep `version` in sync with the workspace
# version in Cargo.toml; the release workflow refuses tags that don't match.
#
# The Supervisor treats nested groups as required and merges only top-level
# defaults on update, so every group below has defaults in `options`.
name: dess-oxide
version: "0.23.1"
slug: dess_oxide
description: Plans and (once you allow it) runs a Victron ESS against Dutch day-ahead prices.
url: https://github.com/georgeboot/dess-oxide
arch:
  - aarch64
  - amd64
image: ghcr.io/georgeboot/dess-oxide
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:battery-clock-outline
panel_title: dess-oxide
# Read Home Assistant's location for the PV forecast.
homeassistant_api: true
options:
  victron:
    host: ""
  dryrun: true
  grid:
    max_import_kw: 17
    max_export_kw: 17
  battery:
    wear_cost_eur_per_kwh: 0
    max_soc: 100
  prices:
    area: NL
  tariff:
    vat:
      - from: "2023-01-01"
        value: 0.21
    energy_tax:
      - from: "2025-01-01"
        value: 0.10154
      - from: "2026-01-01"
        value: 0.09161
    markup_buy:
      - from: "2025-01-01"
        value: 0.02
    markup_sell:
      - from: "2025-01-01"
        value: 0.02
    net_metering_until: "2026-12-31"
    vat_on_export: false
  pv: []
  history: {}
  cheapest_start:
    hours: 3
    kwh: 1
    earliest: "20:00"
    finish_by: "08:00"
  ha_entities: false
  ev:
    on_input: false
  openamber_device: ""
  weather_station: {}
  pv_switch: {}
  language: auto
schema:
  dryrun: bool
  victron:
    host: str
    port: port?
    portal_id: str?
    pv_relay: int(1,2)?
    pv_relay_energized: list(pv_off|pv_on)?
  grid:
    max_import_kw: float
    max_export_kw: float
  battery:
    wear_cost_eur_per_kwh: float
    max_soc: float(10,100)?
  prices:
    area: str
  tariff:
    vat:
      - from: 'match(^\d{4}-\d{2}-\d{2}$)'
        value: float
    energy_tax:
      - from: 'match(^\d{4}-\d{2}-\d{2}$)'
        value: float
    markup_buy:
      - from: 'match(^\d{4}-\d{2}-\d{2}$)'
        value: float
    markup_sell:
      - from: 'match(^\d{4}-\d{2}-\d{2}$)'
        value: float
    net_metering_until: 'match(^\d{4}-\d{2}-\d{2}$)?'
    vat_on_export: bool
  pv:
    - kwp: float
      tilt: float(0,90)
      azimuth: float(0,360)
  history:
    grid_import: str?
    grid_export: str?
    pv: str?
    battery_dc_in: str?
    battery_dc_out: str?
    heat_pump: str?
    ev: str?
  cheapest_start:
    hours: float(0.25,24)
    kwh: float
    earliest: 'match(^\d{2}:\d{2}$)'
    finish_by: 'match(^\d{2}:\d{2}$)'
  ha_entities: bool
  ev:
    on_input: bool
  openamber_device: str
  weather_station:
    temperature: str?
    humidity: str?
    wind_speed: str?
    solar_radiation: str?
  pv_switch:
    entity: str?
    on_means: list(pv_on|pv_off)?
  language: list(auto|en|nl)
  ned_api_key: password?
